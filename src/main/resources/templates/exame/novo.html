<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Novo Exame - PetCore')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragmentos :: menu}"></div>
    <h1>Cadastrar Exame</h1>

    <form th:action="@{/exame/cadastrar}" th:object="${exame}" method="post">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}">
            <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div>
            <label for="tipo">Tipo:</label>
            <input type="text" id="tipo" th:field="*{tipo}">
            <div th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
        </div>

        <div>
            <label for="data">Data e hora:</label>
            <input type="datetime-local" id="data" th:field="*{data}">
            <div th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></div>
        </div>

        <div>
            <label for="idPet">Pet:</label>
            <select id="idPet" th:field="*{idPet}">
                <option value="">Selecione um pet</option>
                <option th:each="pet : ${petsAtivos}" th:value="${pet.id}" th:text="${pet.nome + ' — Tutor: ' + pet.nomesTutores}"></option>
            </select>
            <div th:if="${#fields.hasErrors('idPet')}" th:errors="*{idPet}"></div>
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <br>
    <a th:href="@{/exame/listar}">Voltar</a>
</div>
<script th:replace="~{fragmentos :: bootstrap-script}"></script>
</body>
</html>
