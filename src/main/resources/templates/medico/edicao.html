<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

	<head th:replace="~{fragmentos :: cabecalho('Editar Médico - PetCore')}"></head>

	<body>

	<div class="container">

	    <div th:replace="~{fragmentos :: menu}"></div>

	    <h1>Editar Médico</h1>

	    <form th:action="@{/medico/atualizar}" th:object="${medico}" method="post">

	        <div>

	            <label for="email">Email:</label>

	            <input type="email" id="email" th:field="*{email}">

	            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

	        </div>

	        <div>

	            <label for="telefone">Telefone:</label>

	            <input type="text" id="telefone" th:field="*{telefone}" maxlength="11">

	            <div th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>

	        </div>

	        <div>

	            <label for="senha">Nova senha:</label>

	            <input type="password" id="senha" th:field="*{senha}">

	            <div th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>

	        </div>

	        <div>

	            <label for="urlImg">URL da imagem:</label>

	            <input type="text" id="urlImg" th:field="*{urlImg}">

	            <div th:if="${#fields.hasErrors('urlImg')}" th:errors="*{urlImg}"></div>

	        </div>

	        <br>

	        <button type="submit">Salvar alterações</button>

	    </form>

	    <br>

	    <a th:href="@{/medico/minha-conta}">Voltar</a>

	</div>

	<script th:replace="~{fragmentos :: bootstrap-script}"></script>

	</body>

</html>
