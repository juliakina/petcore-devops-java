<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho('Novo Medicamento - PetCore')}"></head>

<body>

<div class="container">

    <div th:replace="~{fragmentos :: menu}"></div>

    <h1>Cadastrar Medicamento</h1>

    <form th:action="@{/medicamento/cadastrar}" th:object="${medicamento}" method="post">

        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}">
            <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div>
            <label for="dosagem">Dosagem:</label>
            <input type="text" id="dosagem" th:field="*{dosagem}">
            <div th:if="${#fields.hasErrors('dosagem')}" th:errors="*{dosagem}"></div>
        </div>

        <br>

        <button type="submit">Cadastrar</button>

    </form>

    <br>

    <a th:href="@{/medicamento/listar}">Voltar</a>

</div>

<script th:replace="~{fragmentos :: bootstrap-script}"></script>

</body>
</html>
