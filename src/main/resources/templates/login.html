<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

	<head th:replace="~{fragmentos :: cabecalho('Login - PetCore')}"></head>
	
	<body>
	
	<div class="container">
	
	    <h1>PetCore</h1>

    <div th:if="${param.cadastro}" class="alerta-sucesso">Conta cadastrada com sucesso. Faça login para continuar.</div>
    <div th:if="${param.contaExcluida}" class="alerta-sucesso">Conta apagada com sucesso.</div>
	
	    <h2>Login</h2>
	
	    <div th:if="${param.logout}">
	        <p>Logout efetuado com sucesso.</p>
	    </div>
	
	    <div th:if="${param.falha}">
	        <p> Usuário e/ou senha inválidos.</p>
	    </div>
	
	
	    <form th:action="@{/login}" method="post">
	        <div>
	            <label for="username">E-mail</label>
	            <input type="email" id="username" name="username" required>
	        </div>
	
	        <div>
	            <label for="password">Senha</label>
	            <input type="password"id="password" name="password" required>
	        </div>
	        <button type="submit">Entrar</button>
	    </form>
	
	    <hr>
	
	    <p>Ainda não possui uma conta?</p>
	
	    <a th:href="@{/tutor/novo}">Criar conta de Tutor</a>
	
	    <br>
	
	    <a th:href="@{/medico/novo}">Criar conta de Médico</a>
	
	</div>
	
	
	<script th:replace="~{fragmentos :: bootstrap-script}"></script>
	
	</body>
</html>
