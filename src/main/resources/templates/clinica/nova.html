<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Nova Clínica - PetCore')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragmentos :: menu}"></div>
    <h1>Cadastrar Clínica</h1>

    <form th:action="@{/clinica/cadastrar}" th:object="${clinica}" method="post">
        <div>
            <label for="cnpj">CNPJ:</label>
            <input type="text" id="cnpj" th:field="*{cnpj}" maxlength="14">
            <div th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}"></div>
        </div>

        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}">
            <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div>
            <label for="cep">CEP:</label>
            <input type="text" id="cep" th:field="*{cep}" maxlength="8">
            <div th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
        </div>

        <div>
            <label for="complemento">Complemento (opcional):</label>
            <input type="text" id="complemento" th:field="*{complemento}">
            <div th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></div>
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <br>
    <a th:href="@{/clinica/listar}">Voltar</a>
</div>
<script th:replace="~{fragmentos :: bootstrap-script}"></script>
</body>
</html>
