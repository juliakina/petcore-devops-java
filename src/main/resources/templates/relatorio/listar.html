<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho('Relatórios - PetCore')}"></head>

<body>
<div class="container">
    <div th:replace="~{fragmentos :: menu}"></div>

    <h1>Relatórios</h1>
    <p th:if="${#lists.isEmpty(relatorios)}" class="lista-vazia">Nenhum relatório cadastrado.</p>
    <div th:if="${erroExclusao}" th:text="${erroExclusao}"></div>
    <a th:href="@{/relatorio/novo}">Cadastrar novo relatório</a>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Data de criação</th>
                <th>Observação</th>
                <th>Médico</th>
                <th>Pet</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="relatorio : ${relatorios}">
                <td th:text="${relatorio.dataFormatada}"></td>
                <td th:text="${relatorio.observacao}"></td>
                <td th:text="${relatorio.medico != null ? relatorio.medico.nome : 'Sem médico'}"></td>
                <td th:text="${relatorio.historico != null && relatorio.historico.pet != null ? relatorio.historico.pet.nome : 'Sem pet'}"></td>
                <td>
                    <a th:href="@{/relatorio/detalhes/{id}(id=${relatorio.id})}">Detalhes</a><span th:if="${relatorio.historico != null and relatorio.historico.pet != null and relatorio.historico.pet.status.name() == 'ATIVO'}"> |
                        <a th:href="@{/relatorio/editar/{id}(id=${relatorio.id})}">Editar</a> |
                        <a th:href="@{/relatorio/remover/{id}(id=${relatorio.id})}">Remover</a>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script th:replace="~{fragmentos :: bootstrap-script}"></script>
</body>
</html>
